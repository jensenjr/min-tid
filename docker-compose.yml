services:
  app:
    build: .
    ports:
      - "80:3000"
    volumes:
      - min-tid-data:/app/data
    environment:
      JWT_SECRET: "change-this-to-a-long-random-string-in-production"
      DATA_PATH: /app/data/data.json
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped

volumes:
  min-tid-data:
